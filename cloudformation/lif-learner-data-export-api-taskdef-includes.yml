Environment:
  - Name: LIF_MDR_API_URL
    Value:
      Fn::Sub: "https://mdr-api.${PublicHostedZoneName}"
  - Name: OPENAPI_DATA_MODEL_ID
    Value: "17"
  - Name: OPENAPI_JSON_FILENAME
    Value: "openapi_constrained_with_interactions.json"
  - Name: USE_OPENAPI_DATA_MODEL_FROM_FILE
    Value: "false"
  - Name: LIF_QUERY_PLANNER_URL
    Value:
      Fn::Sub: "http://query-planner-org1.lif.${EnvironmentName}.aws:8002"
  - Name: LIF_TRANSLATOR_BASE_URL
    Value:
      Fn::Sub: "http://translator-org1.lif.${EnvironmentName}.aws:8007"
  - Name: QUERY_PLANNER_CLIENT_TIMEOUT_SECONDS
    Value: "30"
  # 45s, not 30 (#1157). A CLR/OB3 export evaluates 32 JSONata expressions over the
  # composed learner record; measured demo runs landed at ~30s, so a 30s budget put the
  # call permanently on the edge of its own timeout and the monitor flapped.
  #
  # 45 and not something larger, deliberately: the synthetic monitor asserts the Result
  # panel within 60s (e2e/tests/mdr-export-playground.spec.ts). The timeout hierarchy has
  # to run outward-in — monitor (60s) > LDE (45s) > actual export — so a slow export
  # surfaces as a clean 500 with a cause in the logs, instead of the monitor timing out
  # first on a request that is still in flight. A value above 60 would invert that.
  - Name: TRANSLATOR_CLIENT_TIMEOUT_SECONDS
    Value: "45"
  # API Key Auth configuration (public paths that don't require auth)
  - Name: LDE_AUTH__PUBLIC_PATHS
    Value: "/health,/health-check"
  - Name: LDE_AUTH__PUBLIC_PATH_PREFIXES
    Value: "/docs,/openapi.json"
  # --- #1034/#1076: composite inbound auth. `composite` accepts a Cognito JWT
  # (humans on the MDR-UI export playground) OR a signed developer key (downstream
  # apps; still stubbed pending #1038). Pool + SPA client mirror the MDR self-serve
  # Cognito, so the JWT minted by the MDR UI validates here. Same SSM keys mdr-api reads.
  - Name: LDE_AUTH__MODE
    Value: composite
  - Name: LDE_AUTH__USER_POOL_ID
    Value:
      Fn::Sub: "{{resolve:ssm:/${EnvironmentName}/mdr/CognitoUserPoolId}}"
  - Name: LDE_AUTH__CLIENT_ID
    Value:
      Fn::Sub: "{{resolve:ssm:/${EnvironmentName}/mdr/CognitoSpaClientId}}"
  - Name: LDE_AUTH__REGION
    Value:
      Fn::Sub: "${AWS::Region}"
  # --- #1076: CORS for the MDR-UI origin (mirrors mdr-api). Credentialed, so
  # origins must be explicit — browsers reject `*` with credentials, and Starlette
  # `allow_origins` is exact-match (no subdomain wildcards). The playground is served
  # from the MDR UI, so `https://mdr.${PublicHostedZoneName}` is the only prod origin.
  - Name: CORS_ALLOW_ORIGINS
    Value:
      Fn::Sub: "http://localhost:3000,http://localhost:5173,http://localhost:8080,https://mdr.${PublicHostedZoneName}"
  - Name: CORS_ALLOW_CREDENTIALS
    Value: true
  - Name: CORS_ALLOW_METHODS
    Value: GET,POST,PUT,DELETE,OPTIONS,PATCH
  - Name: CORS_ALLOW_HEADERS
    Value: "*"
Secrets:
  - Name: LIF_MDR_API_AUTH_TOKEN
    ValueFrom:
      Fn::Sub: "arn:aws:ssm:${AWS::Region}:${AWS::AccountId}:parameter/${EnvironmentName}/${ServiceName}/MdrApiKey"
  # API keys for external/downstream access (key:label CSV; auth disabled if unset).
  # Provision via scripts/setup-api-keys.sh learner-data-export-api <env> --temporary <n> --apply
  - Name: LDE_AUTH__API_KEYS
    ValueFrom:
      Fn::Sub: "arn:aws:ssm:${AWS::Region}:${AWS::AccountId}:parameter/${EnvironmentName}/${ServiceName}/ApiKeys"
