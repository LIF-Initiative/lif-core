AWSTemplateFormatVersion: '2010-09-09'
Description: ECR Repositories

Parameters:

  EnvironmentName:
    Type: String
    Description: The environment name (the SSM prefix path name)
    MaxLength: 10

  S3Bucket:
    Description: Creates a bucket that will hold application configs and files
    Type: String

  GitHubRepos:
    Description: A list of GitHub repositories that have access to GitHub Actions Role in AWS
    Type: CommaDelimitedList

  ExistingProviderArn:
    Description: Only one OIDC provider (for GitHub) may be created per account. If one already exists, provide the ARN.
    Type: String
    Default: 'none'

  AlertEmail:
    Description: Email address subscribed to the ${EnvironmentName}-lif-alerts SNS topic (e.g. synthetic-monitor failures). Empty disables the email subscription.
    Type: String
    Default: ''

  AlertSmsNumber:
    Description: E.164 phone number subscribed to the alerts topic for SMS (e.g. +13135551234). 'none' disables SMS.
    Type: String
    Default: 'none'

  AlertAdditionalEmails:
    Description: Comma-separated additional email addresses to subscribe to the alerts topic (up to 6), e.g. the rest of the dev team. Empty adds none.
    Type: String
    Default: ''

Conditions:

  CreateProvider: !Equals
    - !Ref ExistingProviderArn
    - 'none'

  HasAlertEmail: !Not
    - !Equals [!Ref AlertEmail, '']

  HasAlertSms: !Not
    - !Equals [!Ref AlertSmsNumber, 'none']

  # AlertAdditionalEmails is padded with trailing commas so !Select never runs
  # off the end; a slot is subscribed only if its position holds a non-empty value.
  # 8 slots — plenty of headroom to add more of the team over time.
  HasAddlEmail0: !Not [!Equals [!Select [0, !Split [",", !Sub "${AlertAdditionalEmails},,,,,,,"]], '']]
  HasAddlEmail1: !Not [!Equals [!Select [1, !Split [",", !Sub "${AlertAdditionalEmails},,,,,,,"]], '']]
  HasAddlEmail2: !Not [!Equals [!Select [2, !Split [",", !Sub "${AlertAdditionalEmails},,,,,,,"]], '']]
  HasAddlEmail3: !Not [!Equals [!Select [3, !Split [",", !Sub "${AlertAdditionalEmails},,,,,,,"]], '']]
  HasAddlEmail4: !Not [!Equals [!Select [4, !Split [",", !Sub "${AlertAdditionalEmails},,,,,,,"]], '']]
  HasAddlEmail5: !Not [!Equals [!Select [5, !Split [",", !Sub "${AlertAdditionalEmails},,,,,,,"]], '']]
  HasAddlEmail6: !Not [!Equals [!Select [6, !Split [",", !Sub "${AlertAdditionalEmails},,,,,,,"]], '']]
  HasAddlEmail7: !Not [!Equals [!Select [7, !Split [",", !Sub "${AlertAdditionalEmails},,,,,,,"]], '']]

Resources:

  TranslatorRepo:
    Type: AWS::ECR::Repository
    Properties:
      RepositoryName: !Sub lif/${EnvironmentName}/lif_translator_api
      ImageScanningConfiguration:
        ScanOnPush: true

  LearnerDataExportApiRepo:
    Type: AWS::ECR::Repository
    Properties:
      RepositoryName: !Sub lif/${EnvironmentName}/lif_learner_data_export_api
      ImageScanningConfiguration:
        ScanOnPush: true

  QueryCacheApiRepo:
    Type: AWS::ECR::Repository
    Properties:
      RepositoryName: !Sub lif/${EnvironmentName}/lif_query_cache_api
      ImageScanningConfiguration:
        ScanOnPush: true

  QueryPlannerRepo:
    Type: AWS::ECR::Repository
    Properties:
      RepositoryName: !Sub lif/${EnvironmentName}/lif_query_planner_api
      ImageScanningConfiguration:
        ScanOnPush: true

  GraphQLRepo:
    Type: AWS::ECR::Repository
    Properties:
      RepositoryName: !Sub lif/${EnvironmentName}/lif_graphql_api
      ImageScanningConfiguration:
        ScanOnPush: true

  MongoDBRepo:
    Type: AWS::ECR::Repository
    Properties:
      RepositoryName: !Sub lif/${EnvironmentName}/mongodb
      ImageScanningConfiguration:
        ScanOnPush: true

  SemanticSearchMCPServerRepo:
    Type: AWS::ECR::Repository
    Properties:
      RepositoryName: !Sub lif/${EnvironmentName}/lif_semantic_search_mcp_server
      ImageScanningConfiguration:
        ScanOnPush: true

  AdvisorApiRepo:
    Type: AWS::ECR::Repository
    Properties:
      RepositoryName: !Sub lif/${EnvironmentName}/lif_advisor_api
      ImageScanningConfiguration:
        ScanOnPush: true

  AdvisorAppRepo:
    Type: AWS::ECR::Repository
    Properties:
      RepositoryName: !Sub lif/${EnvironmentName}/lif_advisor_app
      ImageScanningConfiguration:
        ScanOnPush: true

  MongodbSeedRepo:
    Type: AWS::ECR::Repository
    Properties:
      RepositoryName: !Sub lif/${EnvironmentName}/mongodb_seed
      ImageScanningConfiguration:
        ScanOnPush: true

  DagsterCloudAgentRepo:
    Type: AWS::ECR::Repository
    Properties:
      RepositoryName: !Sub lif/${EnvironmentName}/dagster_cloud_agent
      ImageScanningConfiguration:
        ScanOnPush: true

  DagsterCodeLocationRepo:
    Type: AWS::ECR::Repository
    DeletionPolicy: Retain
    Properties:
      RepositoryName: !Sub lif/${EnvironmentName}/dagster_code_location
      ImageScanningConfiguration:
        ScanOnPush: true

  DagsterRepo:
    Type: AWS::ECR::Repository
    DeletionPolicy: Retain
    Properties:
      RepositoryName: !Sub lif/${EnvironmentName}/dagster
      ImageScanningConfiguration:
        ScanOnPush: true

  OrchestratorRepo:
    Type: AWS::ECR::Repository
    Properties:
      RepositoryName: !Sub lif/${EnvironmentName}/lif_orchestrator
      ImageScanningConfiguration:
        ScanOnPush: true

  IdentityMapperRepo:
    Type: AWS::ECR::Repository
    Properties:
      RepositoryName: !Sub lif/${EnvironmentName}/lif_identity_mapper_api
      ImageScanningConfiguration:
        ScanOnPush: true

  IdentityMapperMariaDBRepo:
    Type: AWS::ECR::Repository
    Properties:
      RepositoryName: !Sub lif/${EnvironmentName}/lif_identity_mapper_mariadb
      ImageScanningConfiguration:
        ScanOnPush: true

  ExampleDataSourceRestApiRepo:
    Type: AWS::ECR::Repository
    Properties:
      RepositoryName: !Sub lif/${EnvironmentName}/lif_example_data_source_rest_api
      ImageScanningConfiguration:
        ScanOnPush: true

  MdrApiRepo:
    Type: AWS::ECR::Repository
    Properties:
      RepositoryName: !Sub lif/${EnvironmentName}/lif_mdr_api
      ImageScanningConfiguration:
        ScanOnPush: true

  AppBucket:
    Type: AWS::S3::Bucket
    DeletionPolicy: Retain
    UpdateReplacePolicy: Retain
    Properties:
      BucketName: !Ref S3Bucket

  AppBucketSSMParameter:
    Type: AWS::SSM::Parameter
    Properties:
      Name: !Sub "/${EnvironmentName}/S3Bucket"
      Type: String
      Value: !Ref AppBucket

  GitHubOIDCProvider:
    Type: AWS::IAM::OIDCProvider
    Condition: CreateProvider
    Properties:
      Url: https://token.actions.githubusercontent.com
      ClientIdList:
        - sts.amazonaws.com
      ThumbprintList:
        - 6938fd4d98bab03faadb97b34396831e3780aea1

  GitHubActionsPolicy:
    Type: AWS::IAM::ManagedPolicy
    Properties:
      ManagedPolicyName: !Sub lif-github-actions-policy-${EnvironmentName}
      PolicyDocument:
        Version: 2012-10-17
        Statement:
        - Effect: Allow
          Action:
            - ecr:GetDownloadUrlForLayer
            - ecr:CompleteLayerUpload
            - ecr:UploadLayerPart
            - ecr:InitiateLayerUpload
            - ecr:BatchCheckLayerAvailability
            - ecr:PutImage
            - ecr:BatchGetImage
          Resource: !Sub 'arn:aws:ecr:${AWS::Region}:${AWS::AccountId}:repository/lif/${EnvironmentName}/*'
        - Effect: Allow
          Action:
            - ecr:GetDownloadUrlForLayer
            - ecr:BatchCheckLayerAvailability
            - ecr:BatchGetImage
          Resource: !Sub 'arn:aws:ecr:${AWS::Region}:${AWS::AccountId}:repository/lif/*'
        - Effect: Allow
          Action:
            - 's3:Get*'
            - 's3:List*'
            - 's3:PutObject*'
            - 's3:Delete*'
            - 's3-object-lambda:Get*'
            - 's3-object-lambda:List*'
            - 's3-object-lambda:PutObject*'
          Resource:
            - !Sub 'arn:aws:s3:::${S3Bucket}'
            - !Sub 'arn:aws:s3:::${S3Bucket}/*'
            - !Sub 'arn:aws:s3:::${EnvironmentName}-mdr-${AWS::AccountId}-${AWS::Region}'
            - !Sub 'arn:aws:s3:::${EnvironmentName}-mdr-${AWS::AccountId}-${AWS::Region}/*'
        - Effect: Allow
          Action:
            - 'ssm:GetParameter'
          Resource:
            - !Sub 'arn:aws:ssm:*:*:parameter/${EnvironmentName}*'
        - Effect: Allow
          Action:
            - 'ecs:UpdateService'
            # DescribeServices is required by the post-deploy `aws ecs wait services-stable`
            # steady-state check (#1070) in the update-cluster action.
            - 'ecs:DescribeServices'
          Resource:
            - !Sub 'arn:aws:ecs:${AWS::Region}:${AWS::AccountId}:service/${EnvironmentName}*'
        - Effect: Allow
          # Lets the synthetic-e2e monitor (#1095) publish an alert to the alerts
          # topic when a demo happy-path check fails (#1089).
          Action:
            - 'sns:Publish'
          Resource:
            - !Ref AlertsTopic
        - Effect: Allow
          Action:
            - ecr:GetAuthorizationToken
            - 'ecs:List*'
            - cloudfront:CreateInvalidation
          Resource: '*'

  GitHubActionsRole:
    Type: AWS::IAM::Role
    Properties:
      RoleName: !Sub lif-github-actions-${EnvironmentName}
      AssumeRolePolicyDocument:
        Version: 2012-10-17
        Statement:
          - Effect: Allow
            Principal:
              Federated: !If [CreateProvider, !Ref GitHubOIDCProvider, !Ref ExistingProviderArn]
            Action: sts:AssumeRoleWithWebIdentity
            Condition:
              StringEquals:
                token.actions.githubusercontent.com:aud: sts.amazonaws.com
              StringLike:
                token.actions.githubusercontent.com:sub: !Ref GitHubRepos
      ManagedPolicyArns:
        - !Ref GitHubActionsPolicy
      Tags:
        - Key: Name
          Value: !Sub lif-github-actions-${EnvironmentName}

  # Operational alerts (e.g. synthetic-monitor failures, #1089). No Slack yet, so
  # notifications go out over email + SMS. The topic ARN is published to SSM so
  # workflows can look it up rather than hardcoding it.
  AlertsTopic:
    Type: AWS::SNS::Topic
    Properties:
      TopicName: !Sub ${EnvironmentName}-lif-alerts
      DisplayName: LIFalerts

  AlertsTopicArnParam:
    Type: AWS::SSM::Parameter
    Properties:
      Name: !Sub /${EnvironmentName}/alerts/TopicArn
      Type: String
      Value: !Ref AlertsTopic

  AlertsEmailSubscription:
    Type: AWS::SNS::Subscription
    Condition: HasAlertEmail
    Properties:
      TopicArn: !Ref AlertsTopic
      Protocol: email
      Endpoint: !Ref AlertEmail

  AlertsSmsSubscription:
    Type: AWS::SNS::Subscription
    Condition: HasAlertSms
    Properties:
      TopicArn: !Ref AlertsTopic
      Protocol: sms
      Endpoint: !Ref AlertSmsNumber

  # Additional team email subscriptions, one per non-empty slot in AlertAdditionalEmails.
  AddlEmailSub0:
    Type: AWS::SNS::Subscription
    Condition: HasAddlEmail0
    Properties:
      TopicArn: !Ref AlertsTopic
      Protocol: email
      Endpoint: !Select [0, !Split [",", !Sub "${AlertAdditionalEmails},,,,,,,"]]

  AddlEmailSub1:
    Type: AWS::SNS::Subscription
    Condition: HasAddlEmail1
    Properties:
      TopicArn: !Ref AlertsTopic
      Protocol: email
      Endpoint: !Select [1, !Split [",", !Sub "${AlertAdditionalEmails},,,,,,,"]]

  AddlEmailSub2:
    Type: AWS::SNS::Subscription
    Condition: HasAddlEmail2
    Properties:
      TopicArn: !Ref AlertsTopic
      Protocol: email
      Endpoint: !Select [2, !Split [",", !Sub "${AlertAdditionalEmails},,,,,,,"]]

  AddlEmailSub3:
    Type: AWS::SNS::Subscription
    Condition: HasAddlEmail3
    Properties:
      TopicArn: !Ref AlertsTopic
      Protocol: email
      Endpoint: !Select [3, !Split [",", !Sub "${AlertAdditionalEmails},,,,,,,"]]

  AddlEmailSub4:
    Type: AWS::SNS::Subscription
    Condition: HasAddlEmail4
    Properties:
      TopicArn: !Ref AlertsTopic
      Protocol: email
      Endpoint: !Select [4, !Split [",", !Sub "${AlertAdditionalEmails},,,,,,,"]]

  AddlEmailSub5:
    Type: AWS::SNS::Subscription
    Condition: HasAddlEmail5
    Properties:
      TopicArn: !Ref AlertsTopic
      Protocol: email
      Endpoint: !Select [5, !Split [",", !Sub "${AlertAdditionalEmails},,,,,,,"]]

  AddlEmailSub6:
    Type: AWS::SNS::Subscription
    Condition: HasAddlEmail6
    Properties:
      TopicArn: !Ref AlertsTopic
      Protocol: email
      Endpoint: !Select [6, !Split [",", !Sub "${AlertAdditionalEmails},,,,,,,"]]

  AddlEmailSub7:
    Type: AWS::SNS::Subscription
    Condition: HasAddlEmail7
    Properties:
      TopicArn: !Ref AlertsTopic
      Protocol: email
      Endpoint: !Select [7, !Split [",", !Sub "${AlertAdditionalEmails},,,,,,,"]]

Outputs:

  GitHubOIDCProvider:
    Value: !If [CreateProvider, !Ref GitHubOIDCProvider, !Ref ExistingProviderArn]

  AlertsTopicArn:
    Description: ARN of the operational alerts SNS topic
    Value: !Ref AlertsTopic
