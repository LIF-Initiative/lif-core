AWSTemplateFormatVersion: '2010-09-09'
Description: 'StackSet to deploy S3 website hosting template to us-east-1 region'

Parameters:
  EnvironmentName:
    Type: String
    Description: The environment name (the SSM prefix path name)
    MaxLength: 10

  PublicHostedZoneId:
    Type: 'AWS::SSM::Parameter::Value<String>'

  PublicHostedZoneName:
    Type: 'AWS::SSM::Parameter::Value<String>'
  
  ServiceName:
    Type: String
    Description: Service name to include in bucket name

  TemplateS3Bucket:
    Type: String
    Description: S3 bucket containing the s3-hosted.yml template

  TemplateS3Key:
    Type: String
    Description: S3 key for the s3-hosted.yml template
    Default: cloudformation/s3-hosted.yml

  CreateStackSetRoles:
    Type: String
    AllowedValues: ['true', 'false']
    Default: 'true'
    Description: >
      Whether to create the account-global self-managed StackSet IAM roles
      (AWSCloudFormationStackSet{Administration,Execution}Role). These names are
      shared per-account, so exactly one env's frontend stack should create them
      (true); every other env must reference the existing roles (false), or the
      second stack fails with "...Role already exists".

Conditions:
  ShouldCreateStackSetRoles: !Equals [!Ref CreateStackSetRoles, 'true']

Resources:
  StackSetAdministrationRole:
    Type: AWS::IAM::Role
    Condition: ShouldCreateStackSetRoles
    Properties:
      RoleName: AWSCloudFormationStackSetAdministrationRole
      AssumeRolePolicyDocument:
        Statement:
          - Effect: Allow
            Principal:
              Service: cloudformation.amazonaws.com
            Action: sts:AssumeRole
      Path: /
      Policies:
        - PolicyName: AssumeRole-AWSCloudFormationStackSetExecutionRole
          PolicyDocument:
            Statement:
              - Effect: Allow
                Action:
                  - sts:AssumeRole
                Resource: !Sub 'arn:aws:iam::${AWS::AccountId}:role/AWSCloudFormationStackSetExecutionRole'

  StackSetExecutionRole:
    Type: AWS::IAM::Role
    Condition: ShouldCreateStackSetRoles
    Properties:
      RoleName: AWSCloudFormationStackSetExecutionRole
      AssumeRolePolicyDocument:
        Statement:
          - Effect: Allow
            Principal:
              AWS: !GetAtt StackSetAdministrationRole.Arn
            Action: sts:AssumeRole
      Path: /
      ManagedPolicyArns:
        - arn:aws:iam::aws:policy/PowerUserAccess
      Policies:
        - PolicyName: StackSetExecutionPolicy
          PolicyDocument:
            Statement:
              - Effect: Allow
                Action:
                  - iam:CreateRole
                  - iam:DeleteRole
                  - iam:GetRole
                  - iam:PassRole
                  - iam:AttachRolePolicy
                  - iam:DetachRolePolicy
                  - iam:PutRolePolicy
                  - iam:DeleteRolePolicy
                Resource: '*'

  S3HostedStackSet:
    Type: AWS::CloudFormation::StackSet
    # No explicit DependsOn: when the roles are created here, the !GetAtt in
    # AdministrationRoleARN is an implicit dependency; when reused, they already exist.
    Properties:
      StackSetName: !Sub '${EnvironmentName}-${ServiceName}-s3-hosted-stackset'
      Description: StackSet for S3 website hosting with CloudFront
      AdministrationRoleARN: !If
        - ShouldCreateStackSetRoles
        - !GetAtt StackSetAdministrationRole.Arn
        - !Sub 'arn:aws:iam::${AWS::AccountId}:role/AWSCloudFormationStackSetAdministrationRole'
      ExecutionRoleName: AWSCloudFormationStackSetExecutionRole
      Capabilities:
        - CAPABILITY_NAMED_IAM
      PermissionModel: SELF_MANAGED
      StackInstancesGroup:
        - DeploymentTargets:
            Accounts:
              - !Ref AWS::AccountId
          Regions:
            - us-east-1
      Parameters:
        - ParameterKey: EnvironmentName
          ParameterValue: !Ref EnvironmentName
        - ParameterKey: PublicHostedZoneName
          ParameterValue: !Ref PublicHostedZoneName
        - ParameterKey: PublicHostedZoneId
          ParameterValue: !Ref PublicHostedZoneId
        - ParameterKey: ServiceName
          ParameterValue: !Ref ServiceName
      TemplateURL: !Sub 'https://${TemplateS3Bucket}.s3.amazonaws.com/${TemplateS3Key}'

Outputs:
  StackSetId:
    Description: ID of the created StackSet
    Value: !Ref S3HostedStackSet
  
  StackSetAdministrationRoleArn:
    Condition: ShouldCreateStackSetRoles
    Description: ARN of the StackSet administration role
    Value: !GetAtt StackSetAdministrationRole.Arn

  StackSetExecutionRoleArn:
    Condition: ShouldCreateStackSetRoles
    Description: ARN of the StackSet execution role
    Value: !GetAtt StackSetExecutionRole.Arn
